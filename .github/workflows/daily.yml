name: AlphaReversal Daily Signal

"on":
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      pool:
        description: '股票池'
        required: false
        default: 'hs300'
        type: choice
        options:
          - hs300
          - zz500
          - top1500
          - all_filtered

env:
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

jobs:
  daily-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: 📦 下载历史缓存
        uses: actions/download-artifact@v4
        with:
          name: baostock-cache
          path: cache/
        continue-on-error: true

      - name: 🚀 运行当日策略（增量模式）
        run: |
          START=$(TZ='Asia/Shanghai' date -d '70 days ago' +%Y%m%d)
          END=$(TZ='Asia/Shanghai' date +%Y%m%d)
          POOL="${{ github.event.inputs.pool || 'hs300' }}"
          python scripts/run.py \
            --pool $POOL \
            --start $START \
            --end $END \
            --incremental \
            --no-plot

      - name: 📤 上传更新后的缓存
        uses: actions/upload-artifact@v4
        with:
          name: baostock-cache
          path: cache/
          retention-days: 90

      - name: 📊 推送飞书
        if: env.FEISHU_WEBHOOK != ''
        run: python feishu_notify.py

      - name: 📋 打印摘要
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  运行结束"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ls -la output/ 2>/dev/null || echo "output/ 不存在"
          if [ -f output/trades.csv ]; then
            echo "📄 最近交易记录:"
            tail -5 output/trades.csv
          fi
