name: AlphaReversal Daily Signal

"on":
  schedule:
    - cron: '30 8 * * 1-5'   # 工作日 16:30 北京时间 = UTC 08:30
  workflow_dispatch:
    inputs:
      pool:
        description: '股票池'
        required: false
        default: 'all_filtered'
        type: choice
        options:
          - all_filtered
          - top1500
          - hs300
          - zz500

env:
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

jobs:
  daily-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: 🔧 配置初始化
        run: |
          if [ -f config_template.py ]; then
            cp config_template.py config.py
            echo "✅ 已生成 config.py"
          fi

      # ── 关键：下载历史缓存（如有）──
      - name: 📦 下载 baostock 缓存
        uses: actions/download-artifact@v4
        with:
          name: baostock-cache
          path: cache/
        continue-on-error: true

      - name: 📊 缓存状态
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  缓存目录状态"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -d cache/stocks ]; then
            echo "📂 股票缓存: $(ls cache/stocks/ 2>/dev/null | wc -l) 只"
          else
            echo "📂 股票缓存: 空（首次运行将全量下载）"
            mkdir -p cache/stocks cache/index cache/pool cache/funda
          fi
          if [ -d cache/index ]; then
            echo "📂 指数缓存: $(ls cache/index/ 2>/dev/null | wc -l) 个"
          fi

      - name: 🚀 运行当日策略（增量模式）
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  AlphaReversal 每日回测（增量缓存版）"
          echo "  时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # 数据区间：70 天前 ~ 今天
          START=$(TZ='Asia/Shanghai' date -d '70 days ago' +%Y%m%d)
          END=$(TZ='Asia/Shanghai' date +%Y%m%d)
          POOL="${{ github.event.inputs.pool || 'all_filtered' }}"

          echo "📅 数据区间: $START ~ $END"
          echo "🔄 增量模式：$POOL"
          echo ""

          python scripts/run.py \
            --pool $POOL \
            --start $START \
            --end $END \
            --no-plot \
            --execution next_open

      - name: 📊 推送飞书（完整卡片）
        if: env.FEISHU_WEBHOOK != ''
        run: |
          echo "📤 推送飞书..."
          python feishu_notify.py --mode full --no-image

      - name: 📤 上传更新后的缓存
        uses: actions/upload-artifact@v4
        with:
          name: baostock-cache
          path: cache/
          retention-days: 90

      - name: 📋 打印摘要
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  运行结束"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📂 缓存统计:"
          echo "  股票: $(ls cache/stocks/ 2>/dev/null | wc -l) 只"
          echo "  指数: $(ls cache/index/ 2>/dev/null | wc -l) 个"
          echo "  股票池快照: $(ls cache/pool/ 2>/dev/null | wc -l) 个"
          if [ -f output/trades.csv ]; then
            echo ""
            echo "📄 最近交易记录:"
            tail -5 output/trades.csv
          fi
