name: AlphaReversal Daily Signal

"on":
  schedule:
    - cron: '30 8 * * 1-5'   # 工作日 16:30 北京
  workflow_dispatch:

env:
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

jobs:
  daily-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: 🔧 配置初始化
        run: |
          if [ -f config_template.py ]; then
            cp config_template.py config.py
            echo "✅ 已生成 config.py"
          fi

      # ────────────── 关键修改：无 Token 时使用示例数据 ──────────────
      - name: 🚀 运行策略（有 Token 则真实运行，否则模拟）
        id: run_strategy
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "⚠️ TUSHARE_TOKEN 未设置，使用示例数据模拟"
            mkdir -p output results

            # 创建模拟信号文件（格式：code,price,qty）
            cat > results/signals.csv << EOF
            code,price,qty
            600519.SH,1680.50,5
            300750.SZ,245.30,40
            002594.SZ,89.20,110
            EOF

            # 创建模拟持仓文件（格式：code,buy_price,buy_date）
            cat > results/positions.csv << EOF
            code,buy_price,buy_date
            600036.SH,38.50,2026-07-28
            000858.SZ,142.80,2026-07-21
            EOF

            # 创建模拟交易记录（用于 signal_tracker 统计）
            cat > output/trades.csv << EOF
            date,code,type,price,qty,pnl
            2026-07-31,600519.SH,buy,1680.50,5,0
            2026-07-30,300750.SZ,sell,248.00,40,+108
            2026-07-29,002594.SZ,buy,89.20,110,0
            EOF

            echo "✅ 示例数据已生成"
          else
            echo "🚀 TUSHARE_TOKEN 已设置，开始真实回测"
            START=$(TZ='Asia/Shanghai' date -d '70 days ago' +%Y%m%d)
            END=$(TZ='Asia/Shanghai' date +%Y%m%d)
            python run.py \
              --pool top1500 \
              --start $START \
              --end $END \
              --no-plot \
              --execution next_open
          fi

      - name: 📊 推送飞书（完整卡片）
        if: env.FEISHU_WEBHOOK != ''
        run: |
          echo "📤 推送飞书..."
          python feishu_notify.py --mode full --no-image

      - name: 📤 上传结果存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}
          path: |
            output/
            results/
          retention-days: 30

      - name: 📋 打印摘要
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  运行结束"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ls -la output/ 2>/dev/null || echo "output/ 不存在"
          if [ -f output/trades.csv ]; then
            echo ""
            echo "📄 最近交易记录:"
            tail -5 output/trades.csv
          fi
