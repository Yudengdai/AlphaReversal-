#!/usr/bin/env python3
"""
飞书通知脚本 - 支持 text 和 interactive 卡片两种模式
依赖: requests
"""

import os
import json
import requests
from datetime import datetime
from typing import List, Dict, Optional

# ============ 配置 ============
WEBHOOK_URL = os.environ.get("FEISHU_WEBHOOK", "")
MSG_TYPE = "interactive"  # 可选 "text" 或 "interactive"

# ============ 推送函数 ============

def push_text(text: str) -> bool:
    """发送纯文本消息"""
    if not WEBHOOK_URL:
        print("⚠️ 未配置 FEISHU_WEBHOOK")
        return False
    payload = {
        "msg_type": "text",
        "content": {"text": text}
    }
    return _do_push(payload)


def push_card(card: dict) -> bool:
    """发送卡片消息"""
    if not WEBHOOK_URL:
        print("⚠️ 未配置 FEISHU_WEBHOOK")
        return False
    payload = {
        "msg_type": "interactive",
        "card": card   # 注意：这里是 card 字段，不是 content！
    }
    return _do_push(payload)


def _do_push(payload: dict) -> bool:
    try:
        resp = requests.post(WEBHOOK_URL, json=payload, timeout=10)
        result = resp.json()
        if result.get("code") == 0:
            print("✅ 飞书推送成功")
            return True
        else:
            print(f"⚠️ 飞书推送失败: {result}")
            return False
    except Exception as e:
        print(f"❌ 飞书推送异常: {e}")
        return False


# ============ 卡片构建（已验证） ============

def build_card_from_data(
    date_str: str,
    signals: List[Dict],
    positions: List[Dict],
    metrics: Dict
) -> dict:
    """
    构建符合飞书规范的 interactive 卡片
    参数说明：
        date_str: 日期字符串，如 "2026-07-31"
        signals: 信号列表，每项含 code, price, qty
        positions: 持仓列表，每项含 code, buy_price, buy_date
        metrics: 绩效指标，含 trade_count, win_rate, profit, drawdown, interval_return, baseline
    """
    card = {
        "config": {"wide_screen_mode": True},
        "header": {
            "title": {"tag": "plain_text", "content": f"📊 AlphaReversal 日报 · {date_str}"},
            "template": "blue"
        },
        "elements": []
    }

    # ---------- 绩效概览 ----------
    trade_count = metrics.get("trade_count", "?")
    win_rate = metrics.get("win_rate", "?")
    profit = metrics.get("profit", "?")
    card["elements"].append({
        "tag": "div",
        "text": {
            "tag": "lark_md",
            "content": f"**📈 近30日绩效**\n交易 {trade_count} 笔 | 胜率 {win_rate}% | 盈亏 {profit}"
        }
    })

    # ---------- 回撤与区间收益 ----------
    drawdown = metrics.get("drawdown", "?")
    interval_return = metrics.get("interval_return", "?")
    card["elements"].append({
        "tag": "div",
        "text": {
            "tag": "lark_md",
            "content": f"🟢 当前回撤 {drawdown}%  区间收益 {interval_return}%"
        }
    })

    # ---------- 今日新信号 ----------
    if signals:
        lines = [f"**🎯 今日新信号（{len(signals)} 只）**"]
        for s in signals[:10]:
            code = s.get("code", "?")
            price = s.get("price", "?")
            qty = s.get("qty", "?")
            lines.append(f"▸ {code}  买入价 {price}  数量 {qty}")
        card["elements"].append({
            "tag": "div",
            "text": {"tag": "lark_md", "content": "\n".join(lines)}
        })
    else:
        card["elements"].append({
            "tag": "div",
            "text": {"tag": "lark_md", "content": "**🎯 今日无新信号**"}
        })

    # ---------- 当前持仓 ----------
    if positions:
        lines = [f"**📂 当前持仓（{len(positions)} 只）**"]
        for p in positions[:10]:
            code = p.get("code", "?")
            buy_price = p.get("buy_price", "?")
            buy_date = p.get("buy_date", "?")
            lines.append(f"▸ {code}  买入 {buy_price} ({buy_date})")
        card["elements"].append({
            "tag": "div",
            "text": {"tag": "lark_md", "content": "\n".join(lines)}
        })
    else:
        card["elements"].append({
            "tag": "div",
            "text": {"tag": "lark_md", "content": "**📂 当前无持仓**"}
        })

    # ---------- 分割线 ----------
    card["elements"].append({"tag": "hr"})

    # ---------- 历史基线 ----------
    baseline = metrics.get("baseline", {})
    baseline_str = (
        f"📌 历史基线: 收益+{baseline.get('return','?')}% "
        f"回撤-{baseline.get('dd','?')}%\n"
        f"胜率{baseline.get('win_rate','?')}% "
        f"盈利因子{baseline.get('profit_factor','?')}"
    )
    card["elements"].append({
        "tag": "div",
        "text": {"tag": "lark_md", "content": baseline_str}
    })

    # ---------- 备注 ----------
    risk_note = "✅ 回撤在安全区间内"
    try:
        dd_val = float(str(drawdown).replace("%", ""))
        if dd_val >= 3.0:
            risk_note = "⚠️ 回撤接近警戒线"
    except:
        pass
    card["elements"].append({
        "tag": "note",
        "elements": [
            {"tag": "plain_text", "content": f"{risk_note} | 仅供研究学习，不构成投资建议"}
        ]
    })

    return card


# ============ 数据读取（请根据实际输出格式修改） ============

def load_signals() -> List[Dict]:
    """
    从 results 目录读取今日信号
    假设 run.py 输出 signals.csv，格式：code,price,qty
    若无文件则返回空列表
    """
    signals_path = "results/signals.csv"
    if not os.path.exists(signals_path):
        return []
    signals = []
    with open(signals_path, "r", encoding="utf-8") as f:
        next(f)  # 跳过标题行
        for line in f:
            parts = line.strip().split(",")
            if len(parts) >= 3:
                signals.append({
                    "code": parts[0],
                    "price": parts[1],
                    "qty": parts[2]
                })
    return signals


def load_positions() -> List[Dict]:
    """
    读取当前持仓，假设 positions.csv 格式：code,buy_price,buy_date
    """
    pos_path = "results/positions.csv"
    if not os.path.exists(pos_path):
        return []
    positions = []
    with open(pos_path, "r", encoding="utf-8") as f:
        next(f)
        for line in f:
            parts = line.strip().split(",")
            if len(parts) >= 3:
                positions.append({
                    "code": parts[0],
                    "buy_price": parts[1],
                    "buy_date": parts[2]
                })
    return positions


def load_metrics() -> Dict:
    """
    从 signal_tracker.py 或直接计算得到绩效指标
    这里返回示例数据，实际应接入 signal_tracker 的 report
    """
    # 示例：可以从 signal_log.csv 统计近30日
    return {
        "trade_count": 8,
        "win_rate": 62,
        "profit": "+3420",
        "drawdown": "-2.1%",
        "interval_return": "+1.8%",
        "baseline": {
            "return": "5.94",
            "dd": "3.43",
            "win_rate": "71.86",
            "profit_factor": "1.274"
        }
    }


# ============ 主入口 ============

def main():
    date_str = datetime.now().strftime("%Y-%m-%d")

    # 读取数据（请根据实际情况修改 load_* 函数）
    signals = load_signals()
    positions = load_positions()
    metrics = load_metrics()

    if MSG_TYPE == "text":
        # 纯文本模式（用于测试）
        text_content = (
            f"📊 AlphaReversal 日报 · {date_str}\n"
            f"近30日交易 {metrics['trade_count']} 笔, 胜率 {metrics['win_rate']}%, "
            f"盈亏 {metrics['profit']}\n"
            f"当前回撤 {metrics['drawdown']}, 区间收益 {metrics['interval_return']}\n"
            f"今日信号 {len(signals)} 只, 持仓 {len(positions)} 只"
        )
        success = push_text(text_content)
    else:
        # 卡片模式
        card = build_card_from_data(date_str, signals, positions, metrics)
        success = push_card(card)

    exit(0 if success else 1)


if __name__ == "__main__":
    main()
